name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            os: macos
          - platform: macos-15-intel
            os: macos
          - platform: windows-2022
            os: windows
          - platform: ubuntu-22.04
            os: linux

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      # Keep tauri-action from enabling Finder automation on a headless macOS runner.
      TAURI_BUNDLER_DMG_IGNORE_CI: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system deps
        if: matrix.os == 'linux'
        run: bash scripts/install-tauri-linux-deps.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Rust (stable + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      - name: Verify tag/version alignment
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: npm run check:versions

      - name: Run quality checks
        run: npm run check

      - name: Build and upload release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Trajectory2 ${{ github.ref_name }}
          releaseBody: Trajectory2 with heart-rate drift and aerobic decoupling. macOS bundles use ad-hoc signing without notarization; Windows installers are unsigned. See the README for installation requirements.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: --ci -- --locked
