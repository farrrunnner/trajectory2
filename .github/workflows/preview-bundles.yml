name: Preview Bundles

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version label to validate against package metadata
        required: false
        type: string
      include-macos:
        description: Also build the existing macOS bundles
        required: false
        default: true
        type: boolean

jobs:
  build-preview:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os: linux
            bundles: deb,appimage
            artifact_name: trajectory-linux-bundles
            artifact_paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - platform: windows-latest
            os: windows
            bundles: nsis,msi
            artifact_name: trajectory-windows-bundles
            artifact_paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system deps
        if: matrix.os == 'linux'
        run: bash scripts/install-tauri-linux-deps.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      - name: Verify version alignment
        shell: bash
        run: |
          expected_version="${{ inputs.version }}"
          if [[ -z "$expected_version" ]]; then
            expected_version="$(node -p "require('./package.json').version")"
          fi
          bash scripts/verify-version-alignment.sh "$expected_version"

      - name: Build desktop bundles
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14

  build-preview-macos:
    if: ${{ inputs.include-macos }}
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      - name: Verify version alignment
        shell: bash
        run: |
          expected_version="${{ inputs.version }}"
          if [[ -z "$expected_version" ]]; then
            expected_version="$(node -p "require('./package.json').version")"
          fi
          bash scripts/verify-version-alignment.sh "$expected_version"

      - name: Build desktop bundles
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri build -- --bundles app,dmg

      - name: Verify macOS app signature
        run: codesign --verify --deep --strict src-tauri/target/release/bundle/macos/*.app

      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trajectory-macos-bundles
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
