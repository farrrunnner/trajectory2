[package]
name = "trajectory"
version = "0.1.5"
description = "Trajectory local TCX activity analysis desktop app"
authors = ["Trajectory"]
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
country-boundaries = "1.2.0"
fitparser = "0.9"
isocountry = "0.3.2"
quick-xml = "0.37"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "1"
walkdir = "2"
